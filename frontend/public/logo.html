<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>en lice — logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #F6EFE6;
      font-family: 'Bricolage Grotesque', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 48px 24px;
    }
    .row {
      display: flex;
      align-items: flex-end;
      gap: 32px;
    }
    .swatch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #3A2D2477;
      letter-spacing: 0.5px;
    }
    .mark {
      border-radius: calc(7px * var(--s, 1));
    }
    h1 {
      font-weight: 700;
      font-size: 48px;
      letter-spacing: -2px;
      color: #3A2D24;
    }
    .wordmark {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    hr {
      width: 100%;
      max-width: 480px;
      border: none;
      border-top: 1px solid #3A2D2420;
    }
    .palette {
      display: flex;
      gap: 12px;
    }
    .chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <!-- Full SVG mark at multiple sizes -->
  <div class="row">
    <div class="swatch">
      <svg class="mark" style="--s:0.5" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="7" fill="#3A2D24"/>
        <path d="M7 10 L14 16 L7 22" fill="none" stroke="#C8755A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M25 10 L18 16 L25 22" fill="none" stroke="#F6EFE6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="label">16</span>
    </div>
    <div class="swatch">
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="7" fill="#3A2D24"/>
        <path d="M7 10 L14 16 L7 22" fill="none" stroke="#C8755A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M25 10 L18 16 L25 22" fill="none" stroke="#F6EFE6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="label">32</span>
    </div>
    <div class="swatch">
      <svg class="mark" style="--s:2" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="7" fill="#3A2D24"/>
        <path d="M7 10 L14 16 L7 22" fill="none" stroke="#C8755A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M25 10 L18 16 L25 22" fill="none" stroke="#F6EFE6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="label">64</span>
    </div>
    <div class="swatch">
      <svg class="mark" style="--s:4" xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="7" fill="#3A2D24"/>
        <path d="M7 10 L14 16 L7 22" fill="none" stroke="#C8755A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M25 10 L18 16 L25 22" fill="none" stroke="#F6EFE6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="label">128</span>
    </div>
  </div>

  <hr />

  <!-- Wordmark -->
  <div class="wordmark">
    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 32 32" style="border-radius: calc(7px * 36/32)">
      <rect width="32" height="32" rx="7" fill="#3A2D24"/>
      <path d="M7 10 L14 16 L7 22" fill="none" stroke="#C8755A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M25 10 L18 16 L25 22" fill="none" stroke="#F6EFE6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>en lice</h1>
  </div>

  <hr />

  <!-- Palette -->
  <div class="palette">
    <div class="chip">
      <div class="dot" style="background:#3A2D24"></div>
      <span class="label">umber</span>
    </div>
    <div class="chip">
      <div class="dot" style="background:#C8755A"></div>
      <span class="label">clay</span>
    </div>
    <div class="chip">
      <div class="dot" style="background:#F6EFE6; border: 1px solid #3A2D2420"></div>
      <span class="label">cream</span>
    </div>
  </div>

</body>
</html>
